name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: v2/go.sum

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: test (race)
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: go test -race -count=1 ./...

      - name: fuzz smoke
        run: |
          go test ./antibot -run '^$' -fuzz '^FuzzVerifyPoW$' -fuzztime 15s
          go test ./antibot -run '^$' -fuzz '^FuzzScoreBehavior$' -fuzztime 15s
          go test ./antibot -run '^$' -fuzz '^FuzzVerifyRequest$' -fuzztime 15s
          go test ./base/challenge -run '^$' -fuzz '^FuzzOpen$' -fuzztime 15s

      - name: bench (smoke)
        run: go test ./base/canvas ./base/random -run '^$' -bench . -benchtime 200ms
