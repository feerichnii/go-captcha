<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoCaptcha · AntiBot</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="hero">
    <h1>GoCaptcha · AntiBot</h1>
    <p>Checkbox precheck → Slide / Rotate. Precheck сам по себе не доказывает, что вы человек.</p>
  </header>

  <main class="grid">
    <section class="card" data-kind="rotate">
      <div class="badge">ROTATE</div>
      <label class="checkbox-row">
        <input type="checkbox" class="human-check" />
        <span class="checkbox-label">Я не робот</span>
        <span class="checkbox-spin" hidden aria-hidden="true"></span>
      </label>
      <p class="precheck-hint"></p>
      <div class="interactive" hidden>
        <div class="stage" id="rotate-stage">
          <img class="master" alt="" />
          <img class="thumb" alt="" />
        </div>
        <input class="track" type="range" min="0" max="360" value="0" />
        <p class="hint">Отпусти ползунок — проверка запустится сама</p>
      </div>
      <p class="status"></p>
    </section>

    <section class="card" data-kind="slide">
      <div class="badge">SLIDE</div>
      <label class="checkbox-row">
        <input type="checkbox" class="human-check" />
        <span class="checkbox-label">Я не робот</span>
        <span class="checkbox-spin" hidden aria-hidden="true"></span>
      </label>
      <p class="precheck-hint"></p>
      <div class="interactive" hidden>
        <div class="stage" id="slide-stage">
          <img class="master" alt="" />
          <img class="tile" alt="" draggable="false" />
        </div>
        <input class="track" type="range" min="0" max="100" value="0" />
        <p class="hint">Отпусти ползунок — проверка запустится сама</p>
      </div>
      <p class="status"></p>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
